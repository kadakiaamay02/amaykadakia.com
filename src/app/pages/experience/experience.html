<section class="experience-section">
  <app-code-window
    title="Professional Experience"
    fileName="experience.ts"
    [lines]="headerLines" />

  <div class="timeline">
    @for (job of experiences; track job.company + job.period) {
      <article class="experience-card">
        <div class="card-header">
          <h2 class="role">{{ job.role }}</h2>
          <span class="period">{{ job.period }}</span>
        </div>
        <p class="company">{{ job.company }}</p>

        @if (job.description.length) {
          <ul class="description-list">
            @for (bullet of job.description; track bullet) {
              <li>{{ bullet }}</li>
            }
          </ul>
        }
      </article>
    }
  </div>
</section>
