<h2>Events Dashboard</h2>

<div class="controls">
  <label>Limit: <input type="number" [(ngModel)]="limit" min="1" max="1000" /></label>
  <button (click)="refresh()">Refresh</button>
  <button (click)="startAuto()">Auto 3s</button>
  <button (click)="stopAuto()">Stop</button>
</div>

<table>
  <thead>
    <tr>
      <th>Time</th>
      <th>Source</th>
      <th>Level</th>
      <th>Message</th>
      <th>Data</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of events">
      <td>{{ r.timestamp_iso || '' }}</td>
      <td>{{ r.source || '' }}</td>
      <td [ngClass]="'level-' + (r.level || '').toLowerCase()">
        {{ r.level || '' }}
      </td>
      <td>{{ r.message || '' }}</td>
      <td>
        <pre *ngIf="formatData(r.data)">{{ formatData(r.data) }}</pre>
      </td>
    </tr>
  </tbody>
</table>
