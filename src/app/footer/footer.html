<footer class="footer">
  <div class="footer-container">
    <div class="social-links">
      @for (link of socialLinks; track link.label) {
        <a [href]="link.url" target="_blank" rel="noopener noreferrer" class="social-icon">
          {{ link.label }}
        </a>
      }

      <!-- Looks like the links above; clicking copies the address instead of opening an email app -->
      <button
        type="button"
        class="social-icon social-icon--button"
        [class.social-icon--done]="copied"
        (click)="copyEmail()"
        [title]="'Copy ' + email"
        [attr.aria-label]="'Copy email address ' + email">
        <!-- Both labels sit in the same spot; the hidden one keeps the width steady -->
        <span class="swap" [class.swap--copied]="copied">
          <span class="swap__label">Email</span>
          <span class="swap__label" aria-hidden="true">Copied!</span>
        </span>
      </button>
      <span class="visually-hidden" aria-live="polite">{{ copied ? 'Email address copied to clipboard' : '' }}</span>
    </div>

    <div class="copyright">
      <p>&copy; {{ currentYear }} Amay Kadakia. All rights reserved.</p>
    </div>
  </div>
</footer>
