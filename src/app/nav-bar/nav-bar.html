<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/about" class="nav-logo" (click)="closeMenu()">Amay Kadakia.</a>

    <button
      type="button"
      class="menu-toggle"
      [class.open]="isMenuOpen"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="nav-links"
      [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <ul id="nav-links" class="nav-links" [class.active]="isMenuOpen">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active-link"
            (click)="closeMenu()">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
