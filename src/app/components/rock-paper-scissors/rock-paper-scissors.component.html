
<span class="no-js ss-preload" lang="en">


    <!--- basic page needs
    ================================================== -->
    <meta charset="utf-8">
    <title>Amay Kadakia</title>
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- mobile specific metas
    ================================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- favicons
    ================================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="../../images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">



<span>

        <!-- # preloader
    ================================================== -->
    <div id="preloader">
        <div id="loader">
        </div>
    </div>


    <!-- # page wrap
    ================================================== -->
    <div class="s-pagewrap">

         <header class="s-header">

            <div class="header-mobile">
                <span class="mobile-home-link"><a href="index.html">Amay Kadakia.</a></span>
                <a class="mobile-menu-toggle" href="#0"><span>Menu</span></a>
            </div>

            <div class="row wide main-nav-wrap">
                <nav class="column lg-12 main-nav">
                    <ul>
                        <li><a routerLink="/"class="home-link">Amay Kadakia.</a></li>
                        <li> <a routerLink="/games/rock-paper-scissors" >The Rock Paper Scissors Game</a></li>
                        <li><a routerLink="/games" class="home-link">Games</a></li>
                    </ul>
                        </nav>
            </div>
        </header>


  
        <span class="s-content test" >
            <div class="row about-info wide" >

            <div class="scorecard">
        
                <h2>Wins: {{wins}}  Losses: {{losses}} Draws: {{draws}}</h2>

            </div>
            <div class="emojis" role="main">
                <span class="emoji" (click)="onEmojiClick(1)">{{ Move.ROCK }}</span>
                <span class="emoji" (click)="onEmojiClick(2)">{{ Move.PAPER }}</span>
                <span class="emoji" (click)="onEmojiClick(3)">{{ Move.SCISSOR }}</span>
            </div>

            <div class="button">
                <button class="reset-button" (click)="resetScores()">Reset Scores</button>
            </div>


        </div>
        </span>


    </div>
</span>
</span>
