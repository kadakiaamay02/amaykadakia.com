<div class="cn-page">
  <header class="cn-head">
    <p class="cn-eyebrow">Cosmos Trading Corporation</p>
    <h1>Credit Note generator</h1>
    <p class="cn-sub">Fill in the month's figures and download a print-ready PDF.</p>
  </header>

  <div class="cn-form">
    <div class="grid">
      <label class="field">
        <span>SN number</span>
        <input type="text" name="snNumber" [(ngModel)]="model.snNumber" placeholder="11" inputmode="numeric" />
      </label>

      <label class="field">
        <span>Company name</span>
        <input type="text" name="companyName" [(ngModel)]="model.companyName" placeholder="Venus Traders" />
      </label>

      <label class="field">
        <span>Date</span>
        <input type="date" name="date" [(ngModel)]="model.date" />
      </label>

      <label class="field">
        <span>Month</span>
        <select name="month" [(ngModel)]="model.month">
          <option *ngFor="let m of months" [value]="m">{{ m }}</option>
        </select>
      </label>

      <label class="field span-2">
        <span>Net sales (Rs.)</span>
        <input type="number" name="netSales" [(ngModel)]="model.netSales" placeholder="129816" min="0" />
      </label>

      <label class="field rate">
        <span>First rate (%)</span>
        <input type="number" name="rate18" [(ngModel)]="model.rate18" placeholder="18" step="any" />
      </label>
      <label class="field">
        <span>First-rate amount</span>
        <input type="number" name="amount18" [(ngModel)]="model.amount18" placeholder="275035" min="0" />
      </label>

      <label class="field rate">
        <span>Second rate (%)</span>
        <input type="number" name="rate40" [(ngModel)]="model.rate40" placeholder="40" step="any" />
      </label>
      <label class="field">
        <span>Second-rate amount</span>
        <input type="number" name="amount40" [(ngModel)]="model.amount40" placeholder="691385" min="0" />
      </label>

      <label class="field rate">
        <span>Final rate (%)</span>
        <input type="number" name="rate1" [(ngModel)]="model.rate1" placeholder="1" step="any" />
      </label>
      <label class="field">
        <span>Amount (Rs.)</span>
        <input type="number" name="amount" [(ngModel)]="model.amount" placeholder="2750" min="0" />
      </label>
    </div>

    <p class="cn-words" *ngIf="model.amount">
      In words: <strong>{{ amountWords }} Only</strong>
    </p>

    <p class="cn-error" *ngIf="error">{{ error }}</p>

    <div class="actions">
      <button type="button" class="ghost" (click)="preview()">Preview</button>
      <button type="button" class="solid" (click)="download()">Download PDF</button>
    </div>
  </div>
</div>
